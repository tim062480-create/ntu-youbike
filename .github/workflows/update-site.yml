# 每天晚上用最新的 YouBike 資料重新產生 dashboard，更新網站首頁
# 網站：https://tim062480-create.github.io/ntu-youbike/

name: 每天更新網頁

on:
  schedule:
    - cron: "30 14 * * *"     # 每天台灣時間 22:30（GitHub 用 UTC，所以寫 14:30）
  workflow_dispatch:          # 也可以在 Actions 頁面手動按 Run workflow 立刻更新

concurrency:
  group: update-site
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"     # 程式輸出即時顯示在 Actions 記錄裡
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 更新天氣、驗證、產生網頁
        run: |
          python src/fetch_weather.py || true
          cd src
          python validate.py
          python dashboard.py --publish --no-open

      - name: 存回 repo
        run: |
          git config user.name "youbike-collector"
          git config user.email "youbike-collector@users.noreply.github.com"
          git add index.html data
          git commit -q -m "每天更新網頁 $(date '+%m/%d %H:%M')" || exit 0
          for i in 1 2 3; do
            if git pull -q --rebase; then git push -q && break; else git rebase --abort; fi
            sleep 10
          done
