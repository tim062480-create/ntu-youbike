# 抱石地圖的資料更新（climbing/）
#
#   - 補座標＋OSM 交叉比對（enrich.py）：每週一次，或 gyms_seed.json / 程式有改時
#   - 館附近 YouBike 車數（youbike_near.py）：每 20 分鐘一次，累積歷史給網頁做「到達時」預測
#
# 容器內連不到 OpenStreetMap、YouBike，所以這些都在 GitHub 的主機上跑。
# 注意：schedule 只會在預設分支（main）上執行；在開發分支上是靠 push 觸發。

name: 抱石地圖資料

on:
  schedule:
    - cron: "*/20 * * * *"    # YouBike 車數
    - cron: "15 18 * * 0"     # 每週一 02:15（台灣時間）重新補座標
  push:
    paths:
      - "climbing/data/gyms_seed.json"
      - "climbing/scripts/**"
      - ".github/workflows/climbing-data.yml"
  workflow_dispatch:

concurrency:
  group: climbing-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 補座標、OSM 交叉比對
        if: github.event_name != 'schedule' || github.event.schedule == '15 18 * * 0'
        run: |
          python climbing/scripts/enrich.py
          python climbing/scripts/youbike_near.py --stations

      - name: YouBike 車數
        if: github.event_name == 'schedule' && github.event.schedule == '*/20 * * * *'
        run: python climbing/scripts/youbike_near.py

      - name: 存回 repo
        run: |
          git config user.name "climbing-data-bot"
          git config user.email "climbing-data-bot@users.noreply.github.com"
          git add climbing/data
          git commit -q -m "抱石地圖資料 $(date '+%m/%d %H:%M')" || exit 0
          for i in 1 2 3; do
            if git pull -q --rebase; then git push -q && break; else git rebase --abort; fi
            sleep 10
          done
